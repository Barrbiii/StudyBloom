services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studybloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      POSTGRES_DB: studybloom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybloom"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql+psycopg://studybloom:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/studybloom
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 12
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ready"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    ports:
      - "5173:80"
volumes:
  postgres_data:
