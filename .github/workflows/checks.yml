name: Проверка StudyBloom

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -r backend/requirements-dev.txt
      - name: Проверить API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./studybloom-test.db
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Собрать интерфейс
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать контейнеры
        run: docker compose build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверить интерфейс на компьютере и телефоне
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-screenshots
          path: frontend/test-results/
          retention-days: 14

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: studybloom_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Проверить сохранение прежних строк PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./studybloom-test.db
          POSTGRES_TEST_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/studybloom_test
        run: python -m pytest tests/test_postgres_migration.py -q
