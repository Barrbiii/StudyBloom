name: Проверка StudyBloom

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: pip install -r backend/requirements-dev.txt
      - name: Проверить API
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./studybloom-test.db
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Собрать интерфейс
        working-directory: frontend
        run: |
          npm install
          npm test
          npm run build

  docker:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать контейнеры
        run: docker compose build
      - name: Проверить запуск и ограничение запросов входа
        run: |
          docker compose up -d --wait
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://localhost:5173/api/health
          STUDYBLOOM_SMOKE=1 python scripts/verify-compose.py
          limited=false
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:5173/api/auth/login -H 'Content-Type: application/json' -d '{}')
            if [ "$code" = "429" ]; then limited=true; fi
          done
          test "$limited" = true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Сбросить тестовое окно лимита перед браузером
        run: docker compose restart frontend
      - name: Проверить браузер с настоящим Docker API
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-browser-screenshots-${{ matrix.arch }}
          path: frontend/test-results-live/
          retention-days: 14
      - name: Проверить восстановление приватной резервной копии
        run: STUDYBLOOM_TEST_RESTORE=1 python scripts/verify-restore.py
      - name: Остановить тестовые контейнеры
        if: always()
        run: docker compose down

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Проверить интерфейс на компьютере и телефоне
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-screenshots
          path: frontend/test-results/
          retention-days: 14

  postgres-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: studybloom_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - name: Проверить сохранение прежних строк PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./studybloom-test.db
          POSTGRES_TEST_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/studybloom_test
        run: python -m pytest tests/test_postgres_migration.py -q
